<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
  <title>Messages — Metups</title>
  <style>
  /* Prevent icon blank-flash while Font Awesome loads async */
    .fas, .far, .fab, .fa {
      display: inline-block;
      width: 1em;
      min-height: 1em;
    }
  </style>
  <link rel="preload" href="/assets/css/font-awesome.css"
      as="style" onload="this.onload=null;this.rel='stylesheet'">
  <noscript>
    <link rel="stylesheet" href="/assets/css/font-awesome.css">
  </noscript>
  <script src="/assets/js/runtime-config.js"></script>
  <script src="/assets/js/supabase.min.js"></script>
  <link rel="stylesheet" href="/assets/css/styles.css">
  <link rel="manifest" href="/pwa/manifest.json">
  <meta name="theme-color" content="#4DD9C0">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Metups">
  <link rel="apple-touch-icon" href="/assets/icons/Metups_logo-192.png">
</head>
<body>
<div class="app-shell" id="appShell">

  <!-- ══════════════════════════════════════════
       VIEW A: Conversation LIST
       ══════════════════════════════════════════ -->
  <div id="viewList">
    <nav class="top-nav">
      <button class="nav-icon-btn" onclick="history.back()">
        <i class="fas fa-arrow-left" style="color:var(--blue)"></i>
      </button>
      <div class="nav-logo" style="font-size:1.1rem">
        <div class="logo-lockup" style="align-items: center; gap:12px">
          <div class="logo-icon"></div> <!-- CSS sets the image -->
          <div class="logo-text">
            <span>Messages</span>
          </div>
        </div>
      </div>
      <div class="nav-icons">
        <button class="nav-icon-btn" title="Search conversations">
          <i class="fas fa-search" style="color:var(--blue)"></i>
        </button>
      </div>
    </nav>

    <div style="height:var(--nav-height)"></div>

  <div id="convList"></div>

  <script>
    const convList = document.getElementById("convList");

    const skeletonConv = `
      <div style="display:flex;align-items:center;gap:12px;padding:14px;border-bottom:1px solid var(--border)">
        <div class="skeleton" style="width:48px;height:48px;border-radius:50%;flex-shrink:0"></div>
        <div style="flex:1">
          <div class="skeleton" style="height:13px;width:60%;margin-bottom:6px"></div>
          <div class="skeleton" style="height:11px;width:80%"></div>
        </div>
        <div class="skeleton" style="height:10px;width:30px"></div>
      </div>
    `;

    convList.innerHTML = Array(4).fill().map(() => skeletonConv).join("");
  </script>

    <div id="convEmpty" class="empty-state" style="display:none">
      <i class="fas fa-comment-slash"></i>
      <h3>No conversations yet</h3>
      <p>Start a conversation by messaging a seller on any product listing.</p>
      <a href="/index.html" class="btn btn-primary" style="margin-top:16px">Browse Listings</a>
    </div>
  </div>

  <!-- ══════════════════════════════════════════
       VIEW B: Chat Window
       ══════════════════════════════════════════ -->
  <div id="viewChat" style="display:none">

    <!-- Chat header -->
    <div class="chat-header">
      <button class="back-btn" onclick="closeChat()">
        <i class="fas fa-arrow-left"></i>
      </button>
      <div class="convo-avatar" id="chatAvatar" style="width:36px;height:36px;font-size:.8rem"></div>
      <div class="chat-header-info" style="padding-left:6px">
        <div class="chat-header-name" id="chatName"></div>
        <div style="font-size:.7rem;color:var(--text-muted)" id="chatStatus">Tap for info</div>
      </div>
      <div class="nav-icons">
        <button class="nav-icon-btn" title="More options" id="chatMenuBtn">
          <i class="fas fa-ellipsis-v" style="color:var(--blue)"></i>
        </button>
      </div>
    </div>

    <!-- Product strip (pinned context) -->
    <div class="chat-product-strip" id="chatProductStrip">
      <div class="chat-product-thumb" id="chatProductThumb">
        <div style="width:100%;height:100%;background:var(--teal-light);display:flex;align-items:center;justify-content:center">
          <i class="fas fa-box" style="color:var(--teal-dark)"></i>
        </div>
      </div>
      <div>
        <div class="chat-product-title" id="chatProductTitle"></div>
        <div class="chat-product-price" id="chatProductPrice"></div>
      </div>
      <a href="#" id="chatProductLink" style="margin-left:auto;font-size:.72rem;color:var(--blue);font-weight:700">View ›</a>
    </div>

    <!-- Error banner (upload/send failures) -->
    <div id="chatErrorBanner" style="
      display:none;position:sticky;top:0;z-index:20;
      background:var(--red-light);color:var(--red-dark);
      border-bottom:1px solid var(--red);
      padding:8px 14px;font-size:.82rem;font-weight:600;
    "></div>

    <!-- Messages -->
    <div class="chat-messages" id="chatMessages" style="margin-top:calc(var(--nav-height) + 64px)">
      <!-- Injected messages -->
    </div>

    <!-- Mark as sold banner (for sellers) -->
    <div id="markSoldBanner" style="display:none;background:var(--green);color:#fff;text-align:center;padding:8px;font-weight:700;font-size:.82rem;cursor:pointer" onclick="confirmMarkSold()">
      ✅ Deal made? Mark this item as SOLD
    </div>

    <!-- Input bar -->
    <div class="chat-input-bar" id="normalInputBar">
      <div id="replyPreviewBar" class="reply-preview-bar" style="display:none">
        <div class="reply-preview-accent"></div>
        <div class="reply-preview-body">
          <div class="reply-preview-label">Replying to message</div>
          <div class="reply-preview-text" id="replyPreviewText"></div>
        </div>
        <button class="reply-preview-close" onclick="clearReply()" title="Cancel reply" aria-label="Cancel reply">
          <i class="fas fa-times"></i>
        </button>
      </div>
      <div class="chat-input-wrap">
        <button class="chat-input-icon" id="attachBtn" title="Attach image">
          <i class="fas fa-image"></i>
        </button>
        <input type="file" id="imgAttachInput" accept="image/*" hidden>
        <textarea class="chat-input" id="msgInput" placeholder="Message…" rows="1"></textarea>
        <button class="chat-input-icon" id="emojiBtn">😊</button>
      </div>
      <!-- Show send OR voice depending on input -->
      <button class="chat-send-btn" id="sendBtn" onclick="sendMessage()" style="display:none">
        <i class="fas fa-paper-plane"></i>
      </button>
      <button class="chat-voice-btn" id="voiceBtn" onclick="toggleVoice()">
        <i class="fas fa-microphone"></i>
      </button>
    </div>

    <!-- Image preview bar (shown after choosing an image, before send) -->
    <div id="imagePreviewBar" class="chat-input-bar" style="display:none;
         align-items:center;gap:10px;padding:10px 14px;
         background:var(--white);border-top:1px solid var(--border)">
      <button onclick="cancelImagePreview()" title="Remove image"
              style="width:40px;height:40px;border-radius:50%;border:none;
                     background:var(--red-light);color:var(--red-dark);
                     font-size:.95rem;cursor:pointer;flex-shrink:0;
                     display:flex;align-items:center;justify-content:center">
        <i class="fas fa-times"></i>
      </button>

      <div style="display:flex;align-items:center;gap:10px;flex:1;min-width:0">
        <img id="imagePreviewImg" alt="Selected image preview"
             style="width:52px;height:52px;border-radius:8px;object-fit:cover;
                    border:1px solid var(--border);background:var(--bg-alt);flex-shrink:0">
        <div style="min-width:0;flex:1">
          <div id="imagePreviewName" style="font-size:.82rem;font-weight:700;
               color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis"></div>
          <div style="font-size:.72rem;color:var(--text-muted)">Preview image before sending</div>
        </div>
      </div>

      <button id="sendImageBtn" onclick="sendImagePreview()" title="Send image"
              style="width:44px;height:44px;border-radius:50%;border:none;
                     background:var(--teal);color:#fff;font-size:1.1rem;
                     cursor:pointer;flex-shrink:0;display:flex;
                     align-items:center;justify-content:center;
                     box-shadow:0 2px 8px rgba(77,217,192,.4)">
        <i class="fas fa-paper-plane"></i>
      </button>
    </div>

  </div>

  <!-- ══════════════════════════════════════════
       VOICE RECORDING BAR (replaces input bar while recording)
       Shows: cancel | pulse waveform | timer | stop
       ══════════════════════════════════════════ -->
  <div id="voiceRecordingBar" class="chat-input-bar" style="display:none;
       align-items:center;gap:10px;padding:10px 14px;
       background:var(--white);border-top:1px solid var(--border)">

    <!-- Cancel (trash) -->
    <button onclick="cancelVoice()" title="Cancel recording"
            style="width:40px;height:40px;border-radius:50%;border:none;
                   background:var(--red-light);color:var(--red-dark);
                   font-size:1rem;cursor:pointer;flex-shrink:0;
                   display:flex;align-items:center;justify-content:center">
      <i class="fas fa-trash"></i>
    </button>

    <!-- Pulse waveform animation -->
    <div style="flex:1;display:flex;align-items:center;gap:3px;height:32px;padding:0 6px">
      <div class="rec-pulse-bar" style="animation-delay:0s"></div>
      <div class="rec-pulse-bar" style="animation-delay:.1s"></div>
      <div class="rec-pulse-bar" style="animation-delay:.2s"></div>
      <div class="rec-pulse-bar" style="animation-delay:.15s"></div>
      <div class="rec-pulse-bar" style="animation-delay:.05s"></div>
      <div class="rec-pulse-bar" style="animation-delay:.25s"></div>
      <div class="rec-pulse-bar" style="animation-delay:.1s"></div>
      <div class="rec-pulse-bar" style="animation-delay:.3s"></div>
      <div class="rec-pulse-bar" style="animation-delay:.2s"></div>
      <div class="rec-pulse-bar" style="animation-delay:.05s"></div>
      <div class="rec-pulse-bar" style="animation-delay:.15s"></div>
      <div class="rec-pulse-bar" style="animation-delay:.25s"></div>
    </div>

    <!-- Timer (M:SS) -->
    <div id="voiceTimer" style="font-family:var(--font-head);font-weight:800;
         font-size:.95rem;color:var(--red-dark);letter-spacing:.02em;
         min-width:38px;text-align:right;flex-shrink:0">0:00</div>

    <!-- Recording dot indicator -->
    <div style="width:10px;height:10px;border-radius:50%;background:var(--red);
         flex-shrink:0;animation:recBlink 1s infinite"></div>

    <!-- Stop → go to preview -->
    <button onclick="stopVoice()" title="Stop recording"
            style="width:44px;height:44px;border-radius:50%;border:none;
                   background:var(--blue);color:#fff;
                   font-size:1.1rem;cursor:pointer;flex-shrink:0;
                   display:flex;align-items:center;justify-content:center;
                   box-shadow:0 2px 8px rgba(27,68,200,.35)">
      <i class="fas fa-stop"></i>
    </button>
  </div>

  <!-- ══════════════════════════════════════════
       VOICE PREVIEW BAR (shown after stop, before send)
       Shows: re-record | audio player | duration | send
       ══════════════════════════════════════════ -->
  <div id="voicePreviewBar" class="chat-input-bar" style="display:none;
       align-items:center;gap:10px;padding:10px 14px;
       background:var(--white);border-top:1px solid var(--border)">

    <!-- Re-record -->
    <button onclick="reRecordVoice()" title="Re-record"
            style="width:40px;height:40px;border-radius:50%;border:none;
                   background:var(--teal-light);color:var(--teal-dark);
                   font-size:.95rem;cursor:pointer;flex-shrink:0;
                   display:flex;align-items:center;justify-content:center">
      <i class="fas fa-redo"></i>
    </button>

    <!-- Audio preview player -->
    <audio id="voicePreviewAudio" controls preload="auto"
           style="flex:1;height:36px;min-width:0;max-width:100%"></audio>

    <!-- Duration label -->
    <span id="voicePreviewDuration" style="font-size:.75rem;color:var(--text-muted);
          font-family:var(--font-head);font-weight:700;flex-shrink:0"></span>

    <!-- Send -->
    <button id="sendVoiceBtn" onclick="sendVoice()" title="Send voice message"
            style="width:44px;height:44px;border-radius:50%;border:none;
                   background:var(--teal);color:#fff;
                   font-size:1.1rem;cursor:pointer;flex-shrink:0;
                   display:flex;align-items:center;justify-content:center;
                   box-shadow:0 2px 8px rgba(77,217,192,.4)">
      <i class="fas fa-paper-plane"></i>
    </button>
  </div>

</div><!-- /.app-shell -->

<script type="module">
  import { supabaseClient } from '/assets/js/supabase.js';
  import { checkAuth, formatCurrency, getAvatarInitials, formatDate } from '/assets/js/utils.js';

  // ── Storage bucket name (change here if you rename the bucket) ──
  const IMAGES_BUCKET   = 'product_images';   // public bucket — use getPublicUrl
  const MESSAGES_BUCKET = 'messages';           // PRIVATE bucket — must use signed URLs

  // Generate a 1-hour signed URL for a file in the private messages bucket.
  // getPublicUrl() returns a broken URL for private buckets — always use this instead.
  async function signedMediaUrl(path) {
    const { data, error } = await supabaseClient.storage
      .from(MESSAGES_BUCKET)
      .createSignedUrl(path, 315360000); // 10 years expiry (effectively no expiration)
    if (error) { console.warn('[signedMediaUrl]', error.message); return null; }
    return data.signedUrl;
  }

  // Show an error banner inside the chat that dismisses after 5 seconds.
  function showChatError(msg) {
    const el = document.getElementById('chatErrorBanner');
    if (!el) { alert(msg); return; } // fallback if banner not in DOM
    el.textContent = '⚠ ' + msg;
    el.style.display = 'block';
    clearTimeout(el._timer);
    el._timer = setTimeout(() => { el.style.display = 'none'; }, 5000);
  }

  // ──────────────────────────────────────
  // STATE
  // ──────────────────────────────────────
  let currentUser        = null;
  let activeConvId       = null;
  let activeConv         = null;
  let realtimeSub        = null;
  let mediaRecorder      = null;
  let isRecording        = false;
  let audioChunks        = [];
  let pendingImageFile   = null;
  let pendingImageUrl    = null;
  let pendingReply       = null;
  const messageCache     = new Map();
  // Prevents initInputListener() re-attaching on every openChat() call,
  // which caused sendMessage() to fire multiple times per keypress.
  let inputListenerBound = false;

  // ──────────────────────────────────────
  // BOOT
  // ──────────────────────────────────────
  document.addEventListener('DOMContentLoaded', async () => {
    currentUser = await checkAuth();
    if (!currentUser) { window.location.href = '../auth/login.html'; return; }

    // Request notification permission
    if ('Notification' in window && Notification.permission === 'default') {
      Notification.requestPermission();
    }

    document.addEventListener('click', closeMessageMenus);
    await loadConversations();

    // Open specific conversation from URL query param
    const params = new URLSearchParams(window.location.search);
    const convId = params.get('conversation');
    if (convId) openChat(convId);
  });

  // ──────────────────────────────────────
  // LOAD CONVERSATIONS LIST
  // ──────────────────────────────────────
  async function loadConversations() {
    const { data: convs, error } = await supabaseClient
      .from('conversations')
      .select(`
        *,
        product:products(id, title, price),
        buyer:profiles!buyer_id(id, full_name, avatar_url),
        seller:profiles!seller_id(id, full_name, avatar_url)
      `)
      .or(`buyer_id.eq.${currentUser.id},seller_id.eq.${currentUser.id}`)
      .order('last_message_at', { ascending: false });

    if (error || !convs || convs.length === 0) {
      document.getElementById('convList').innerHTML = '';
      document.getElementById('convEmpty').style.display = 'block';
      return;
    }

    // Load last message for each
    const withLastMsg = await Promise.all(convs.map(async (c) => {
      const { data: msg } = await supabaseClient
        .from('messages')
        .select('content, sent_at, sender_id, message_type')
        .eq('conversation_id', c.id)
        .order('sent_at', { ascending: false })
        .limit(1)
        .maybeSingle();
      return { ...c, lastMsg: msg };
    }));

    renderConvList(withLastMsg);

    // Subscribe to real-time updates for conversation list
    subscribeToConversationUpdates();
  }

  function subscribeToConversationUpdates() {
    const convSub = supabaseClient
      .channel('conversations-updates')
      .on('postgres_changes', {
        event: '*',
        schema: 'public',
        table: 'conversations',
        filter: `buyer_id=eq.${currentUser.id},seller_id=eq.${currentUser.id}`
      }, (payload) => {
        // Reload conversations when any conversation updates
        loadConversations();
      })
      .subscribe();
  }

  function renderConvList(convs) {
    const list = document.getElementById('convList');
    list.innerHTML = convs.map(c => {
      // The other person in the conversation
      const other = currentUser.id === c.buyer_id ? c.seller : c.buyer;
      const initials = getAvatarInitials(other?.full_name || 'UN');
      const lastText = c.lastMsg
        ? (c.lastMsg.message_type === 'image' ? '📷 Image' : c.lastMsg.message_type === 'voice' ? '🎤 Voice message' : c.lastMsg.content)
        : 'No messages yet';
      const time = c.lastMsg
        ? new Date(c.lastMsg.sent_at).toLocaleTimeString([], { hour:'2-digit', minute:'2-digit' })
        : '';

      return `
        <div class="convo-item" onclick="openChat('${c.id}')">
          <div class="convo-avatar">
            ${other?.avatar_url
              ? `<img src="${other.avatar_url}" alt="${initials}">`
              : initials
            }
          </div>
          <div class="convo-info">
            <div class="convo-name">${escHtml(other?.full_name || 'Unknown')}</div>
            <div class="convo-product">${escHtml(c.product?.title || '')}</div>
            <div class="convo-last">${escHtml(lastText)}</div>
          </div>
          <div class="convo-meta">
            <div class="convo-time">${time}</div>
            ${c.unread_count > 0 ? `<div class="unread-dot"></div>` : ''}
          </div>
        </div>
      `;
    }).join('');
  }

  // ──────────────────────────────────────
  // OPEN CHAT
  // ──────────────────────────────────────
  window.openChat = async (convId) => {
    activeConvId = convId;

    // Fetch full conversation details
    const { data: conv } = await supabaseClient
      .from('conversations')
      .select(`
        *,
        product:products(id, title, price, seller_id),
        buyer:profiles!buyer_id(id, full_name, avatar_url),
        seller:profiles!seller_id(id, full_name, avatar_url)
      `)
      .eq('id', convId)
      .single();

    if (!conv) return;
    activeConv = conv;

    // Switch views
    document.getElementById('viewList').style.display = 'none';
    document.getElementById('viewChat').style.display = 'block';

    // Populate header
    const other = currentUser.id === conv.buyer_id ? conv.seller : conv.buyer;
    const initials = getAvatarInitials(other?.full_name || 'UN');
    const avatarEl = document.getElementById('chatAvatar');
    if (other?.avatar_url) avatarEl.innerHTML = `<img src="${other.avatar_url}" style="width:100%;height:100%;object-fit:cover;border-radius:50%">`;
    else avatarEl.textContent = initials;
    document.getElementById('chatName').textContent = other?.full_name || 'Unknown';

    // Product strip
    if (conv.product) {
      document.getElementById('chatProductTitle').textContent = conv.product.title;
      document.getElementById('chatProductPrice').textContent = formatCurrency(conv.product.price);
      document.getElementById('chatProductLink').href = `../products/product.html?id=${conv.product.id}`;
    }

    // Load first image for product strip
    const { data: pImg } = await supabaseClient
      .from('product_images')
      .select('image_url')
      .eq('product_id', conv.product?.id)
      .limit(1)
      .maybeSingle();
    if (pImg?.image_url) {
      // image_url is a storage path — reconstruct full URL via getPublicUrl
      const { data: imgData } = supabaseClient.storage.from(IMAGES_BUCKET).getPublicUrl(pImg.image_url);
      document.getElementById('chatProductThumb').innerHTML = `<img src="${imgData.publicUrl}" style="width:100%;height:100%;object-fit:cover">`;
    }

    // Mark as sold banner (shown only to seller)
    if (currentUser.id === conv.seller_id && !conv.product?.sold) {
      document.getElementById('markSoldBanner').style.display = 'block';
    }

    // Load messages
    await loadMessages(convId);

    // Mark conversation as read
    await supabaseClient.from('conversations').update({ unread_count: 0 }).eq('id', convId);
    await supabaseClient.from('messages').update({ read_at: new Date().toISOString() })
      .eq('conversation_id', convId).neq('sender_id', currentUser.id).is('read_at', null);

    // Subscribe to real-time messages
    subscribeToMessages(convId);

    // Input listener
    initInputListener();

    // Scroll to bottom
    scrollToBottom();
  };

  window.closeChat = () => {
    cancelImagePreview();
    cancelVoice();
    clearReply();
    closeMessageMenus();

    // Unsubscribe
    if (realtimeSub) { supabaseClient.removeChannel(realtimeSub); realtimeSub = null; }
    activeConvId = null;
    activeConv   = null;

    document.getElementById('viewChat').style.display = 'none';
    document.getElementById('viewList').style.display = 'block';

    // Reload conversation list to update unread counts
    loadConversations();
  };

  // ──────────────────────────────────────
  // MESSAGES
  // ──────────────────────────────────────
  async function loadMessages(convId) {
    const { data: msgs } = await supabaseClient
      .from('messages')
      .select('*')
      .eq('conversation_id', convId)
      .order('sent_at', { ascending: true });

    messageCache.clear();
    (msgs || []).forEach(m => messageCache.set(m.id, m));
    renderMessages(msgs || []);
  }

  function renderMessages(msgs) {
    const container = document.getElementById('chatMessages');
    if (msgs.length === 0) {
      container.innerHTML = `<div class="chat-date-label">Start the conversation!</div>`;
      return;
    }

    let lastDate = null;
    container.innerHTML = msgs.map(m => {
      const isSent = m.sender_id === currentUser.id;
      const date   = new Date(m.sent_at);
      const dayStr = date.toDateString();
      const timeStr = date.toLocaleTimeString([], { hour:'2-digit', minute:'2-digit' });

      let dateSep = '';
      if (dayStr !== lastDate) {
        lastDate = dayStr;
        const today = new Date().toDateString();
        const label = dayStr === today ? 'Today' : date.toLocaleDateString([], { day:'numeric', month:'short' });
        dateSep = `<div class="chat-date-label">${label}</div>`;
      }

      const tick = m.read_at
        ? '<i class="fas fa-check-double" style="color:var(--teal-dark)"></i>'
        : m.delivered_at
          ? '<i class="fas fa-check-double" style="color:var(--text-light)"></i>'
          : '<i class="fas fa-check" style="color:var(--text-light)"></i>';

      let bubbleContent = '';
      let quotedMessage = '';

      // Build quoted message if this is a reply
      if (m.reply_to_id) {
        const repliedMsg = messageCache.get(m.reply_to_id);
        if (repliedMsg) {
          const repliedIsSent = repliedMsg.sender_id === currentUser.id;
          const repliedSender = repliedIsSent ? 'You' : activeConv?.seller?.full_name || activeConv?.buyer?.full_name || 'Them';
          let repliedText = '';

          if (repliedMsg.message_type === 'image') {
            repliedText = repliedMsg.content?.trim() || '📷 Image';
          } else if (repliedMsg.message_type === 'voice') {
            repliedText = '🎤 Voice message';
          } else {
            repliedText = repliedMsg.content?.trim() || '(empty message)';
          }

          quotedMessage = `
            <div class="message-quote" onclick="scrollToMessage('${m.reply_to_id}')" style="cursor:pointer">
              <div class="quote-sender">${escHtml(repliedSender)}</div>
              <div class="quote-text">${escHtml(repliedText.substring(0, 100))}</div>
            </div>
          `;
        }
      }

      if (m.message_type === 'image' && m.media_url) {
        bubbleContent = `
          <a href="${m.media_url}" target="_blank" rel="noopener" style="display:block">
            <img src="${m.media_url}"
                 style="max-width:220px;width:100%;border-radius:10px;display:block;cursor:zoom-in"
                 alt="Image"
                 loading="lazy"
                 onerror="this.outerHTML='<span style=\'font-size:.78rem;color:var(--text-muted)\'>Image no longer available</span>'">
          </a>
          ${m.content ? `<p style="margin-top:5px;font-size:.85rem">${escHtml(m.content)}</p>` : ''}
        `;
      } else if (m.message_type === 'voice' && m.media_url) {
        bubbleContent = `
          <div style="display:flex;align-items:center;gap:8px;min-width:160px">
            <i class="fas fa-microphone" style="color:var(--teal-dark);font-size:.85rem;flex-shrink:0"></i>
            <audio controls src="${m.media_url}"
                   style="flex:1;height:32px;min-width:130px;max-width:200px"
                   preload="none"></audio>
          </div>
        `;
      } else if (m.message_type === 'system') {
        bubbleContent = `<span style="font-style:italic;color:var(--text-muted);font-size:.82rem">${escHtml(m.content)}</span>`;
      } else {
        bubbleContent = `<span>${escHtml(m.content)}</span>`;
      }

      return `
        ${dateSep}
        <div class="message-row ${isSent ? 'sent' : 'received'}" id="msg-${m.id}">
          ${!isSent ? `<div class="msg-avatar">${getAvatarInitials(activeConv?.buyer?.full_name || 'B')}</div>` : ''}
          <div class="bubble ${isSent ? 'sent' : 'received'}">
            ${renderMessageActions(m, isSent)}
            ${quotedMessage}
            ${bubbleContent}
            <div class="bubble-time">
              ${timeStr}
              ${isSent ? tick : ''}
            </div>
          </div>
        </div>
      `;
    }).join('');

    scrollToBottom();
  }

  function appendMessage(msg) {
    const container  = document.getElementById('chatMessages');
    const isSent     = msg.sender_id === currentUser.id;
    const date       = new Date(msg.sent_at);
    const timeStr    = date.toLocaleTimeString([], { hour:'2-digit', minute:'2-digit' });

    const div = document.createElement('div');
    div.className = `message-row ${isSent ? 'sent' : 'received'}`;
    div.id = `msg-${msg.id}`;
    messageCache.set(msg.id, msg);

    let bubbleContent = '';
    let quotedMessage = '';

    // Build quoted message if this is a reply
    if (msg.reply_to_id) {
      const repliedMsg = messageCache.get(msg.reply_to_id);
      if (repliedMsg) {
        const repliedIsSent = repliedMsg.sender_id === currentUser.id;
        const repliedSender = repliedIsSent ? 'You' : activeConv?.seller?.full_name || activeConv?.buyer?.full_name || 'Them';
        let repliedText = '';

        if (repliedMsg.message_type === 'image') {
          repliedText = repliedMsg.content?.trim() || '📷 Image';
        } else if (repliedMsg.message_type === 'voice') {
          repliedText = '🎤 Voice message';
        } else {
          repliedText = repliedMsg.content?.trim() || '(empty message)';
        }

        quotedMessage = `
          <div class="message-quote">
            <div class="quote-sender">${escHtml(repliedSender)}</div>
            <div class="quote-text">${escHtml(repliedText.substring(0, 100))}</div>
          </div>
        `;
      }
    }

    // Build bubble content for all message types
    if (msg.message_type === 'image' && msg.media_url) {
      bubbleContent = `
        <a href="${msg.media_url}" target="_blank" rel="noopener" style="display:block">
          <img src="${msg.media_url}"
               style="max-width:220px;width:100%;border-radius:10px;display:block;cursor:zoom-in"
               alt="Image" loading="lazy"
               onerror="this.outerHTML='<span style=\'font-size:.78rem;color:var(--text-muted)\'>Image no longer available</span>'">
        </a>
        ${msg.content ? `<p style="margin-top:5px;font-size:.85rem">${escHtml(msg.content)}</p>` : ''}
      `;
    } else if (msg.message_type === 'voice' && msg.media_url) {
      bubbleContent = `
        <div style="display:flex;align-items:center;gap:8px;min-width:160px">
          <i class="fas fa-microphone" style="color:var(--teal-dark);font-size:.85rem;flex-shrink:0"></i>
          <audio controls src="${msg.media_url}"
                 style="flex:1;height:32px;min-width:130px;max-width:200px"
                 preload="none"></audio>
        </div>
      `;
    } else if (msg.message_type === 'system') {
      bubbleContent = `<span style="font-style:italic;color:var(--text-muted);font-size:.82rem">${escHtml(msg.content)}</span>`;
    } else {
      bubbleContent = `<span>${escHtml(msg.content)}</span>`;
    }

    div.innerHTML = `
      ${!isSent ? `<div class="msg-avatar">${getAvatarInitials(activeConv?.buyer?.full_name || 'B')}</div>` : ''}
      <div class="bubble ${isSent ? 'sent' : 'received'}">
        ${renderMessageActions(msg, isSent)}
        ${quotedMessage}
        ${bubbleContent}
        <div class="bubble-time">${timeStr}</div>
      </div>
    `;
    container.appendChild(div);
    scrollToBottom();
  }

  function renderMessageActions(msg, isSent) {
    if (msg.message_type === 'system') return '';
    const hasMedia = Boolean(msg.media_url);
    const hasText = Boolean(msg.content?.trim()) && msg.message_type !== 'voice';
    return `
      <div class="message-actions">
        <button class="message-menu-btn"
                onclick="toggleMessageMenu(event, '${msg.id}')"
                title="Message options"
                aria-label="Message options"
                aria-expanded="false">
          <i class="fas fa-ellipsis-v"></i>
        </button>
        <div class="message-menu" id="message-menu-${msg.id}">
          ${hasMedia ? `
            <button onclick="downloadMessageMedia(event, '${msg.id}')">
              <i class="fas fa-download"></i><span>Download</span>
            </button>
          ` : ''}
          ${isSent ? `
            <button class="danger" onclick="deleteMessage(event, '${msg.id}')">
              <i class="fas fa-trash"></i><span>Delete</span>
            </button>
          ` : ''}
          ${hasText ? `
            <button onclick="copyMessageText(event, '${msg.id}')">
              <i class="fas fa-copy"></i><span>Copy text</span>
            </button>
          ` : ''}
          <button onclick="replyToMessage(event, '${msg.id}')">
            <i class="fas fa-reply"></i><span>Reply</span>
          </button>
        </div>
      </div>
    `;
  }

  window.toggleMessageMenu = (event, messageId) => {
    event?.preventDefault();
    event?.stopPropagation();

    const menu = document.getElementById(`message-menu-${messageId}`);
    const btn = event?.currentTarget;
    const row = document.getElementById(`msg-${messageId}`);
    const willOpen = !menu?.classList.contains('open');
    closeMessageMenus();
    if (!menu) return;

    menu.classList.toggle('open', willOpen);
    row?.classList.toggle('menu-open', willOpen);
    btn?.setAttribute('aria-expanded', willOpen ? 'true' : 'false');
  };

  function closeMessageMenus() {
    document.querySelectorAll('.message-menu.open').forEach(menu => menu.classList.remove('open'));
    document.querySelectorAll('.message-row.menu-open').forEach(row => row.classList.remove('menu-open'));
    document.querySelectorAll('.message-menu-btn[aria-expanded="true"]').forEach(btn => {
      btn.setAttribute('aria-expanded', 'false');
    });
  }

  window.deleteMessage = async (event, messageId) => {
    event?.preventDefault();
    event?.stopPropagation();
    closeMessageMenus();

    const msg = messageCache.get(messageId);
    const messageType = msg?.message_type || 'text';
    const label = messageType === 'image'
      ? 'this image'
      : messageType === 'voice'
        ? 'this voice message'
        : 'this message';

    if (!confirm(`Delete ${label}?`)) return;

    const row = document.getElementById(`msg-${messageId}`);
    row?.classList.add('deleting');

    const { error } = await supabaseClient
      .from('messages')
      .delete()
      .eq('id', messageId)
      .eq('sender_id', currentUser.id);

    if (error) {
      row?.classList.remove('deleting');
      showChatError('Could not delete message: ' + error.message);
      return;
    }

    const mediaPath = getMessageMediaPath(msg?.media_url || '');
    if (mediaPath) {
      supabaseClient.storage.from(MESSAGES_BUCKET).remove([mediaPath]).catch(() => {});
    }

    row?.remove();
    messageCache.delete(messageId);
    if (pendingReply?.id === messageId) clearReply();
    if (activeConvId) {
      await supabaseClient
        .from('conversations')
        .update({ last_message_at: new Date().toISOString() })
        .eq('id', activeConvId);
    }
  };

  function getMessageMediaPath(mediaUrl) {
    if (!mediaUrl) return null;
    try {
      const url = new URL(mediaUrl);
      const marker = `/storage/v1/object/sign/${MESSAGES_BUCKET}/`;
      const idx = url.pathname.indexOf(marker);
      if (idx === -1) return null;
      return decodeURIComponent(url.pathname.slice(idx + marker.length));
    } catch {
      return null;
    }
  }

  window.downloadMessageMedia = (event, messageId) => {
    event?.preventDefault();
    event?.stopPropagation();
    closeMessageMenus();

    const msg = messageCache.get(messageId);
    if (!msg?.media_url) return;

    const ext = msg.message_type === 'voice' ? 'webm' : 'jpg';
    const a = document.createElement('a');
    a.href = msg.media_url;
    a.download = `metups-${msg.message_type}-${messageId}.${ext}`;
    a.target = '_blank';
    a.rel = 'noopener';
    document.body.appendChild(a);
    a.click();
    a.remove();
  };

  window.copyMessageText = async (event, messageId) => {
    event?.preventDefault();
    event?.stopPropagation();
    closeMessageMenus();

    const msg = messageCache.get(messageId);
    const text = msg?.content?.trim();
    if (!text) return;

    try {
      await navigator.clipboard.writeText(text);
    } catch {
      const ta = document.createElement('textarea');
      ta.value = text;
      ta.style.position = 'fixed';
      ta.style.opacity = '0';
      document.body.appendChild(ta);
      ta.select();
      document.execCommand('copy');
      ta.remove();
    }
  };

  window.replyToMessage = (event, messageId) => {
    event?.preventDefault();
    event?.stopPropagation();
    closeMessageMenus();

    const msg = messageCache.get(messageId);
    if (!msg) return;

    pendingReply = {
      id: messageId,
      summary: getMessageSummary(msg)
    };

    document.querySelectorAll('.message-row.reply-target').forEach(row => {
      row.classList.remove('reply-target');
    });

    const targetRow = document.getElementById(`msg-${messageId}`);
    targetRow?.classList.add('reply-target');
    targetRow?.scrollIntoView({ behavior: 'smooth', block: 'nearest' });

    const bar = document.getElementById('replyPreviewBar');
    const text = document.getElementById('replyPreviewText');
    if (bar) bar.style.display = 'flex';
    if (text) text.textContent = pendingReply.summary;
    document.getElementById('msgInput')?.focus();
  };

  window.clearReply = () => {
    if (pendingReply?.id) {
      document.getElementById(`msg-${pendingReply.id}`)?.classList.remove('reply-target');
    }
    pendingReply = null;
    const bar = document.getElementById('replyPreviewBar');
    const text = document.getElementById('replyPreviewText');
    if (bar) bar.style.display = 'none';
    if (text) text.textContent = '';
  };

  function getMessageSummary(msg) {
    if (msg.message_type === 'image') return msg.content?.trim() || 'Image';
    if (msg.message_type === 'voice') return 'Voice message';
    return msg.content?.trim() || 'Message';
  }

  // ──────────────────────────────────────
  // SEND MESSAGE
  // ──────────────────────────────────────
  window.sendMessage = async () => {
    const input   = document.getElementById('msgInput');
    const content = input.value.trim();
    if (!content || !activeConvId) return;

    input.value = '';
    toggleSendVoiceBtn('');

    const messageData = {
      conversation_id: activeConvId,
      sender_id: currentUser.id,
      content,
      message_type: 'text'
    };

    // Include reply reference if replying to a message
    if (pendingReply?.id) {
      messageData.reply_to_id = pendingReply.id;
    }

    const { data: msg, error } = await supabaseClient
      .from('messages')
      .insert(messageData)
      .select()
      .single();

    // Surface any database / RLS error to the user
    if (error) {
      console.error('[sendMessage] insert failed:', error);
      // Re-populate the input so the user doesn't lose their message
      input.value = content;
      toggleSendVoiceBtn(content);
      showChatError('Could not send message: ' + (error.message || 'Unknown error'));
      return;
    }

    if (msg) {
      appendMessage(msg);
      await bumpConversationAfterSend();
      clearReply();
    }
  };

  async function bumpConversationAfterSend() {
    if (!activeConvId) return;

    // Increment unread_count for the other participant when the RPC exists.
    const { error: rpcErr } = await supabaseClient.rpc('increment_unread', {
      conv_id: activeConvId
    });

    if (!rpcErr) return;

    console.warn('[increment_unread] RPC failed, using fallback:', rpcErr.message);
    const { error: fallbackErr } = await supabaseClient
      .from('conversations')
      .update({ last_message_at: new Date().toISOString() })
      .eq('id', activeConvId);

    if (fallbackErr) console.error('[fallback update failed]', fallbackErr.message);
  }

  // ──────────────────────────────────────
  // IMAGE ATTACHMENT
  // ──────────────────────────────────────
  document.getElementById('attachBtn').addEventListener('click', () => {
    document.getElementById('imgAttachInput').click();
  });

  document.getElementById('imgAttachInput').addEventListener('change', (e) => {
    const file = e.target.files[0];
    if (!file) return;
    if (!activeConvId) {
      showChatError('Open a conversation before sending an image.');
      e.target.value = '';
      return;
    }
    if (!file.type.startsWith('image/')) {
      showChatError('Please choose an image file.');
      e.target.value = '';
      return;
    }

    cancelImagePreview();
    pendingImageFile = file;
    pendingImageUrl = URL.createObjectURL(file);

    const img = document.getElementById('imagePreviewImg');
    const name = document.getElementById('imagePreviewName');
    if (img) img.src = pendingImageUrl;
    if (name) name.textContent = file.name;

    _setRecordingState('idle');
    _setImagePreviewState(true);
  });

  function _setImagePreviewState(show) {
    const normalBar = document.getElementById('normalInputBar');
    const previewBar = document.getElementById('imagePreviewBar');
    if (!normalBar || !previewBar) return;

    previewBar.style.display = show ? 'flex' : 'none';
    normalBar.style.display = show ? 'none' : '';
  }

  window.cancelImagePreview = () => {
    if (pendingImageUrl) URL.revokeObjectURL(pendingImageUrl);
    pendingImageFile = null;
    pendingImageUrl = null;

    const img = document.getElementById('imagePreviewImg');
    const name = document.getElementById('imagePreviewName');
    const input = document.getElementById('imgAttachInput');
    if (img) img.removeAttribute('src');
    if (name) name.textContent = '';
    if (input) input.value = '';

    const sendImageBtn = document.getElementById('sendImageBtn');
    if (sendImageBtn) {
      sendImageBtn.disabled = false;
      sendImageBtn.innerHTML = '<i class="fas fa-paper-plane"></i>';
    }

    _setImagePreviewState(false);
  };

  function _safeStorageName(fileName) {
    const cleaned = (fileName || 'image')
      .replace(/[^a-zA-Z0-9._-]/g, '_')
      .replace(/_+/g, '_')
      .slice(-80);
    return cleaned || 'image';
  }

  window.sendImagePreview = async () => {
    const file = pendingImageFile;
    if (!file || !activeConvId) return;

    const btn = document.getElementById('sendImageBtn');
    if (btn) {
      btn.disabled = true;
      btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i>';
    }

    const filePath = `conversations/${activeConvId}/${Date.now()}_${_safeStorageName(file.name)}`;
    const { error: uploadErr } = await supabaseClient.storage
      .from('messages')
      .upload(filePath, file, { cacheControl: '3600', upsert: false, contentType: file.type });

    if (uploadErr) {
      showChatError('Image upload failed: ' + uploadErr.message);
      if (btn) {
        btn.disabled = false;
        btn.innerHTML = '<i class="fas fa-paper-plane"></i>';
      }
      return;
    }

    // messages bucket is PRIVATE — getPublicUrl() returns a broken URL.
    // Must use createSignedUrl() to get a real, authenticated URL.
    const imageSignedUrl = await signedMediaUrl(filePath);
    if (!imageSignedUrl) {
      showChatError('Could not generate image link. Check bucket permissions.');
      if (btn) {
        btn.disabled = false;
        btn.innerHTML = '<i class="fas fa-paper-plane"></i>';
      }
      return;
    }

    const { error: dbErr } = await supabaseClient.from('messages').insert({
      conversation_id: activeConvId,
      sender_id:       currentUser.id,
      content:         '',
      message_type:    'image',
      media_url:       imageSignedUrl
    });

    if (dbErr) {
      showChatError('Failed to send image: ' + dbErr.message);
      if (btn) {
        btn.disabled = false;
        btn.innerHTML = '<i class="fas fa-paper-plane"></i>';
      }
      return;
    }

    await bumpConversationAfterSend();
    cancelImagePreview();
    await loadMessages(activeConvId);
  };

  // ──────────────────────────────────────
  // VOICE RECORDING — WhatsApp style
  //
  // States:
  //   idle      → voiceBtn visible, recordingBar hidden, previewBar hidden
  //   recording → voiceBtn hidden, recordingBar visible (timer + pulse + cancel + stop)
  //   preview   → voiceBtn hidden, recordingBar hidden, previewBar visible (play + re-record + send)
  // ──────────────────────────────────────

  let _recStream   = null;   // MediaStream — stopped on cancel or after upload
  let _recBlob     = null;   // final Blob held for preview → send
  let _recTimer    = null;   // setInterval handle for the clock
  let _recSeconds  = 0;      // elapsed recording seconds

  // Pad a number to 2 digits
  function _pad(n) { return String(n).padStart(2, '0'); }

  // Show/hide the three recording UI zones
  function _setRecordingState(state) {
    // state: 'idle' | 'recording' | 'preview'
    const bar     = document.getElementById('normalInputBar');
    const recBar  = document.getElementById('voiceRecordingBar');
    const prevBar = document.getElementById('voicePreviewBar');
    const imgBar  = document.getElementById('imagePreviewBar');
    if (!bar || !recBar || !prevBar) return;

    bar.style.display     = state === 'idle'      ? '' : 'none';
    recBar.style.display  = state === 'recording' ? 'flex' : 'none';
    prevBar.style.display = state === 'preview'   ? 'flex' : 'none';
    if (imgBar && state !== 'idle') imgBar.style.display = 'none';
  }

  // Start the MM:SS clock on the recording bar
  function _startTimer() {
    _recSeconds = 0;
    document.getElementById('voiceTimer').textContent = '0:00';
    _recTimer = setInterval(() => {
      _recSeconds++;
      const m = Math.floor(_recSeconds / 60);
      const s = _recSeconds % 60;
      document.getElementById('voiceTimer').textContent = `${m}:${_pad(s)}`;
    }, 1000);
  }

  function _stopTimer() {
    clearInterval(_recTimer);
    _recTimer = null;
  }

  // ── Called by the mic button in the normal input bar ─────────────
  window.toggleVoice = async () => {
    if (isRecording) {
      // Already recording — stop button in the recording bar handles this
      return;
    }

    if (!navigator.mediaDevices?.getUserMedia) {
      showChatError('Voice recording is not supported in this browser.');
      return;
    }

    try {
      _recStream = await navigator.mediaDevices.getUserMedia({ audio: true });
      audioChunks = [];

      // Pick the best supported MIME type
      const mimeType = [
        'audio/webm;codecs=opus',
        'audio/webm',
        'audio/ogg;codecs=opus',
        'audio/mp4',
      ].find(t => MediaRecorder.isTypeSupported(t)) || '';

      mediaRecorder = new MediaRecorder(_recStream, mimeType ? { mimeType } : {});

      // timeslice=100ms — data arrives every 100ms so the browser never
      // buffers the whole recording in RAM (fixes the "stops after a while" bug)
      mediaRecorder.ondataavailable = (e) => {
        if (e.data && e.data.size > 0) audioChunks.push(e.data);
      };

      mediaRecorder.onstop = () => {
        _stopTimer();
        // Build the blob for preview
        _recBlob = new Blob(audioChunks, { type: mediaRecorder.mimeType || 'audio/webm' });
        if (!_recBlob.size) {
          _recBlob = null;
          audioChunks = [];
          isRecording = false;
          _setRecordingState('idle');
          showChatError('No audio was recorded. Please try again.');
          return;
        }

        // Load into the preview player
        const previewAudio = document.getElementById('voicePreviewAudio');
        const blobUrl = URL.createObjectURL(_recBlob);
        previewAudio.src = blobUrl;
        previewAudio.load();

        // Show preview duration
        const m = Math.floor(_recSeconds / 60);
        const s = _recSeconds % 60;
        const dur = document.getElementById('voicePreviewDuration');
        if (dur) dur.textContent = `${m}:${_pad(s)}`;

        isRecording = false;
        _setRecordingState('preview');
      };

      mediaRecorder.start(100); // 100ms timeslice — the critical fix
      isRecording = true;
      _startTimer();
      _setRecordingState('recording');

    } catch (err) {
      isRecording = false;
      _setRecordingState('idle');
      if (err.name === 'NotAllowedError') {
        showChatError('Microphone access denied. Allow microphone in browser settings.');
      } else {
        showChatError('Could not start recording: ' + err.message);
      }
    }
  };

  // ── Cancel — discard everything and go back to idle ──────────────
  window.cancelVoice = () => {
    if (mediaRecorder && isRecording) {
      mediaRecorder.onstop = () => {}; // suppress the preview transition
      mediaRecorder.stop();
    }
    _stopTimer();
    if (_recStream) { _recStream.getTracks().forEach(t => t.stop()); _recStream = null; }
    audioChunks = [];
    _recBlob    = null;
    isRecording = false;

    // Revoke any blob URL from the preview player
    const previewAudio = document.getElementById('voicePreviewAudio');
    if (previewAudio) { URL.revokeObjectURL(previewAudio.src); previewAudio.src = ''; }
    const sendVoiceBtn = document.getElementById('sendVoiceBtn');
    if (sendVoiceBtn) { sendVoiceBtn.disabled = false; sendVoiceBtn.innerHTML = '<i class="fas fa-paper-plane"></i>'; }

    _setRecordingState('idle');
  };

  // ── Stop recording → enter preview ───────────────────────────────
  window.stopVoice = () => {
    if (mediaRecorder && isRecording) {
      mediaRecorder.stop(); // triggers onstop → preview
    }
    if (_recStream) { _recStream.getTracks().forEach(t => t.stop()); _recStream = null; }
  };

  // ── Re-record — back to idle, user taps mic again ────────────────
  window.reRecordVoice = () => {
    const previewAudio = document.getElementById('voicePreviewAudio');
    if (previewAudio) { URL.revokeObjectURL(previewAudio.src); previewAudio.src = ''; }
    const sendVoiceBtn = document.getElementById('sendVoiceBtn');
    if (sendVoiceBtn) { sendVoiceBtn.disabled = false; sendVoiceBtn.innerHTML = '<i class="fas fa-paper-plane"></i>'; }
    _recBlob = null;
    _setRecordingState('idle');
  };

  // ── Send — upload the blob and insert the message ────────────────
  window.sendVoice = async () => {
    if (!_recBlob || !activeConvId) return;
    if (!_recBlob.size) {
      showChatError('No audio was recorded. Please try again.');
      reRecordVoice();
      return;
    }

    // Disable send button while uploading
    const sendVoiceBtn = document.getElementById('sendVoiceBtn');
    if (sendVoiceBtn) { sendVoiceBtn.disabled = true; sendVoiceBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i>'; }

    const ext  = _recBlob.type.includes('ogg') ? 'ogg' : _recBlob.type.includes('mp4') ? 'mp4' : 'webm';
    const path = `conversations/${activeConvId}/voice_${Date.now()}.${ext}`;

    const { error: uploadErr } = await supabaseClient.storage
      .from('messages')
      .upload(path, _recBlob, { cacheControl: '3600', upsert: false, contentType: _recBlob.type });

    if (uploadErr) {
      showChatError('Upload failed: ' + uploadErr.message);
      if (sendVoiceBtn) { sendVoiceBtn.disabled = false; sendVoiceBtn.innerHTML = '<i class="fas fa-paper-plane"></i>'; }
      return;
    }

    const voiceSignedUrl = await signedMediaUrl(path);
    if (!voiceSignedUrl) {
      showChatError('Could not generate audio link. Check bucket permissions.');
      if (sendVoiceBtn) { sendVoiceBtn.disabled = false; sendVoiceBtn.innerHTML = '<i class="fas fa-paper-plane"></i>'; }
      return;
    }

    const { error: dbErr } = await supabaseClient.from('messages').insert({
      conversation_id: activeConvId,
      sender_id:       currentUser.id,
      content:         '🎤 Voice message',
      message_type:    'voice',
      media_url:       voiceSignedUrl,
    });

    if (dbErr) {
      showChatError('Failed to send voice message: ' + dbErr.message);
      if (sendVoiceBtn) { sendVoiceBtn.disabled = false; sendVoiceBtn.innerHTML = '<i class="fas fa-paper-plane"></i>'; }
      return;
    }

    // Clean up and return to idle
    const previewAudio = document.getElementById('voicePreviewAudio');
    if (previewAudio) { URL.revokeObjectURL(previewAudio.src); previewAudio.src = ''; }
    _recBlob = null;
    _setRecordingState('idle');
    if (sendVoiceBtn) {
      sendVoiceBtn.disabled = false;
      sendVoiceBtn.innerHTML = '<i class="fas fa-paper-plane"></i>';
    }

    await bumpConversationAfterSend();
    await loadMessages(activeConvId);
  };

  // ──────────────────────────────────────
  // REAL-TIME SUBSCRIPTION
  // ──────────────────────────────────────
  function subscribeToMessages(convId) {
    if (realtimeSub) supabaseClient.removeChannel(realtimeSub);

    realtimeSub = supabaseClient
      .channel(`chat-${convId}`)
      .on('postgres_changes', {
        event: 'INSERT',
        schema: 'public',
        table: 'messages',
        filter: `conversation_id=eq.${convId}`
      }, (payload) => {
        // Only append if it's from the OTHER person (our own was already appended)
        if (payload.new.sender_id !== currentUser.id) {
          appendMessage(payload.new);

          // Send browser notification
          sendMessageNotification(payload.new);

          // Update page title with unread count
          updatePageTitle();

          // Mark as delivered
          supabaseClient.from('messages')
            .update({ delivered_at: new Date().toISOString() })
            .eq('id', payload.new.id);
        }
      })
      .subscribe();
  }

  function sendMessageNotification(msg) {
    if (!('Notification' in window)) return;
    if (Notification.permission !== 'granted') return;

    const otherUser = currentUser.id === activeConv?.buyer_id ? activeConv?.seller : activeConv?.buyer;
    const senderName = otherUser?.full_name || 'Unknown';
    let notifBody = '';

    if (msg.message_type === 'image') {
      notifBody = msg.content?.trim() || '📷 Image';
    } else if (msg.message_type === 'voice') {
      notifBody = '🎤 Voice message';
    } else {
      notifBody = msg.content?.trim() || '(message)';
    }

    new Notification(senderName, {
      body: notifBody.substring(0, 100),
      icon: otherUser?.avatar_url || '/assets/icons/Metups_logo-192.png',
      tag: `msg-${msg.id}`,
      badge: '/assets/icons/Metups_logo-72.png'
    });

    // Play notification sound
    playNotificationSound();
  }

  function playNotificationSound() {
    try {
      const audioContext = new (window.AudioContext || window.webkitAudioContext)();
      const oscillator = audioContext.createOscillator();
      const gainNode = audioContext.createGain();

      oscillator.connect(gainNode);
      gainNode.connect(audioContext.destination);

      oscillator.frequency.value = 800;
      oscillator.type = 'sine';

      gainNode.gain.setValueAtTime(0.3, audioContext.currentTime);
      gainNode.gain.exponentialRampToValueAtTime(0.01, audioContext.currentTime + 0.1);

      oscillator.start(audioContext.currentTime);
      oscillator.stop(audioContext.currentTime + 0.1);
    } catch (e) {
      // Fallback: silent if audio context fails
    }
  }

  function updatePageTitle() {
    const badge = document.querySelector('.nav-badge');
    if (badge) {
      const count = parseInt(badge.textContent) || 0;
      if (count > 0) {
        document.title = `(${count}) Messages — Metups`;
      }
    }
  }

  // ──────────────────────────────────────
  // INPUT LISTENER — show send vs voice button
  // ──────────────────────────────────────
  function initInputListener() {
    // Only bind once — openChat() can be called multiple times in a session
    if (inputListenerBound) return;
    inputListenerBound = true;

    const input = document.getElementById('msgInput');
    input.addEventListener('input', () => toggleSendVoiceBtn(input.value.trim()));
    input.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        sendMessage();
      }
    });
  }

  function toggleSendVoiceBtn(val) {
    document.getElementById('sendBtn').style.display  = val ? 'flex' : 'none';
    document.getElementById('voiceBtn').style.display = val ? 'none' : 'flex';
  }

  // ──────────────────────────────────────
  // MARK AS SOLD
  // ──────────────────────────────────────
  window.confirmMarkSold = async () => {
    if (!activeConv?.product) return;
    if (!confirm(`Mark "${activeConv.product.title}" as SOLD?`)) return;

    const { error } = await supabaseClient
      .from('products')
      .update({ sold: true, sold_at: new Date().toISOString(), sold_to_id: activeConv.buyer_id })
      .eq('id', activeConv.product.id);

    if (error) { showChatError('Error: ' + error.message); return; }

    // Send system message in chat
    await supabaseClient.from('messages').insert({
      conversation_id: activeConvId,
      sender_id: currentUser.id,
      content: `✅ Item sold! "${activeConv.product.title}" has been marked as SOLD.`,
      message_type: 'system'
    });

    document.getElementById('markSoldBanner').style.display = 'none';
    await loadMessages(activeConvId);
    showChatError('✅ Item marked as sold!'); // reuses banner for success too
  };

  // ──────────────────────────────────────
  // HELPERS
  // ──────────────────────────────────────
  function scrollToBottom() {
    const el = document.getElementById('chatMessages');
    if (el) setTimeout(() => { el.scrollTop = el.scrollHeight; }, 50);
  }

  window.scrollToMessage = (messageId) => {
    const targetRow = document.getElementById(`msg-${messageId}`);
    if (!targetRow) return;

    // Remove previous highlights
    document.querySelectorAll('.message-row.quote-highlight').forEach(row => {
      row.classList.remove('quote-highlight');
    });

    // Scroll to and highlight the message
    targetRow.classList.add('quote-highlight');
    targetRow.scrollIntoView({ behavior: 'smooth', block: 'center' });

    // Remove highlight after 3 seconds
    setTimeout(() => {
      targetRow.classList.remove('quote-highlight');
    }, 3000);
  }

  function escHtml(s) {
    return (s || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  }
</script>
