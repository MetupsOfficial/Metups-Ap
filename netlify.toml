# ================================================================
# METUPS — NETLIFY DEPLOYMENT CONFIG
# netlify.toml
#
# Place this file at the ROOT of your project (same level as src/).
# Deploy: drag the project folder to app.netlify.com/drop
#         or run: netlify deploy --prod
# ================================================================

[build]
  # No build step — pure static HTML/JS/CSS
  publish = "src"

# ── Edge function: inject product OG tags server-side ────────────
# Fixes WhatsApp / Twitter / Facebook link preview images.
# Social scrapers don't run JS, so og:image must be in the raw HTML.
[[edge_functions]]
  function = "og-product"
  path     = "/features/products/product.html"

# ── Security headers for all pages ──────────────────────────────
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options        = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy        = "strict-origin-when-cross-origin"
    Permissions-Policy     = "geolocation=(self), camera=(self), microphone=(self)"

# ── Service Worker — must not be cached by browser ───────────────
[[headers]]
  for = "/pwa/sw.js"
  [headers.values]
    Cache-Control          = "no-cache, no-store, must-revalidate"
    Service-Worker-Allowed = "/pwa/"

# ── Manifest — should be fresh ───────────────────────────────────
[[headers]]
  for = "/pwa/manifest.json"
  [headers.values]
    Cache-Control = "no-cache"

# ── Long-cache static assets (CSS, JS, images) ───────────────────
[[headers]]
  for = "*.css"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "*.js"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/assets/icons/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# ── Redirect bare domain to index ────────────────────────────────
[[redirects]]
  from   = "/"
  to     = "/index.html"
  status = 200

# ── SPA-style fallback (handles deep links / page refresh) ───────
[[redirects]]
  from   = "/*"
  to     = "/index.html"
  status = 200
