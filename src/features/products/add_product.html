<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
  <title>Add Listing — Metups</title>
  <style>
  /* Prevent icon blank-flash while Font Awesome loads async */
    .fas, .far, .fab, .fa {
      display: inline-block;
      width: 1em;
      min-height: 1em;
    }
  </style>
  <link rel="preload" href="/shared/font-awesome.css"
      as="style" onload="this.onload=null;this.rel='stylesheet'">
  <noscript>
    <link rel="stylesheet" href="/shared/font-awesome.css">
  </noscript>
  <script src="/shared/supabase.min.js"></script>
  <link rel="stylesheet" href="/shared/styles.css">
  <link rel="manifest" href="/pwa/manifest.json">
  <meta name="theme-color" content="#4DD9C0">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Metups">
  <link rel="apple-touch-icon" href="/assets/icons/Metups_logo-192.png">
</head>
<body>
<div class="app-shell">

  <!-- Top Nav -->
  <nav class="top-nav">
    <button class="nav-icon-btn" onclick="history.back()">
      <i class="fas fa-arrow-left" style="color:var(--blue)"></i>
    </button>
      <div class="nav-logo" id="pageHeading" style="font-size:1.1rem">
        <div class="logo-lockup" style="align-items: center; gap:12px">
          <div class="logo-icon"></div> <!-- CSS sets the image -->
          <div class="logo-text">
            <span>Add Listing</span>
          </div>
        </div>
      </div>
      
  </nav>

  <div style="height:var(--nav-height)"></div>

  <form id="productForm" style="padding:14px 14px 120px">

    <!-- Image upload zone -->
    <div class="form-group">
      <label>Images *</label>
      <input type="file" id="imageInput" multiple accept="image/*" hidden>
      <div class="image-upload-zone" id="uploadZone" onclick="document.getElementById('imageInput').click()">
        <div class="upload-icon"><i class="fas fa-camera-retro"></i></div>
        <p><strong>Tap to add photos</strong></p>
        <p>First photo will be the cover. Max 10 photos.</p>
      </div>
      <div class="upload-preview-grid" id="previewGrid"></div>
      <div id="uploadStatus" style="font-size:.78rem;color:var(--text-muted);margin-top:6px"></div>
    </div>

    <!-- Product Name -->
    <div class="form-group">
      <label>Product Name *</label>
      <input type="text" id="title" class="input-field" placeholder="e.g. iPhone 11 64GB" required maxlength="100">
    </div>

    <!-- Description -->
    <div class="form-group">
      <label>Description *</label>
      <textarea id="description" class="input-field" rows="4"
                placeholder="Describe your item — condition, age, any defects…" required maxlength="1000"></textarea>
    </div>

    <!-- Price & Condition -->
    <div style="display:flex;gap:10px">
      <div class="form-group" style="flex:1">
        <label>Price ($) *</label>
        <div class="input-with-icon">
          <i class="fas fa-dollar-sign"></i>
          <input type="number" id="price" class="input-field" placeholder="0.00" min="0" step="0.01" required>
        </div>
      </div>
      <div class="form-group" style="flex:1">
        <label>Condition *</label>
        <select id="condition" class="input-field" required>
          <option value="">Select…</option>
          <option value="New">New</option>
          <option value="Like-New">Like-New</option>
          <option value="Fair">Fair</option>
          <option value="Needs Repair">Needs Repair</option>
        </select>
      </div>
    </div>

    <!-- Category & Location (synced from sticky bar) -->
    <div style="display:flex;gap:10px">
      <div class="form-group" style="flex:1">
        <label>Category *</label>
        <select id="category" class="input-field" required>
          <option value="">Select…</option>
          <option value="Electronics">Electronics</option>
          <option value="Fashion">Fashion</option>
          <option value="Furniture">Furniture</option>
          <option value="Appliances">Appliances</option>
          <option value="Vehicles">Vehicles</option>
          <option value="Books">Books</option>
          <option value="Other">Other</option>
        </select>
      </div>
      <div class="form-group" style="flex:1">
        <label>Location *</label>
        <input type="text" id="location" class="input-field" placeholder="City, Area" required>
      </div>
    </div>

    <!-- Tags / Keywords (brand, model, specs) -->
    <div class="form-group">
      <label>
        Keywords
        <span style="font-weight:400;color:var(--text-muted);font-size:.78rem"> — brand, model, colour, specs</span>
      </label>
      <!--
        Tags help buyers find this listing with partial searches.
        Examples: "Samsung A52", "64GB black", "Core i5 8GB"
        User types a word and presses Enter or comma to add it as a chip.
      -->
      <div id="tagsContainer" style="
        display:flex;flex-wrap:wrap;gap:6px;align-items:center;
        min-height:42px;padding:6px 10px;
        border:1px solid var(--border);border-radius:10px;
        background:var(--white);cursor:text;
      " onclick="document.getElementById('tagsInput').focus()">
        <!-- Tag chips are injected here by JS -->
        <input
          type="text"
          id="tagsInput"
          placeholder='e.g. Samsung, A52, black, 128GB'
          style="border:none;outline:none;flex:1;min-width:120px;
                 font-size:.85rem;background:transparent;padding:2px 0;"
          autocomplete="off"
        >
      </div>
      <p style="font-size:.72rem;color:var(--text-muted);margin-top:4px">
        Press <kbd style="padding:1px 4px;background:var(--bg);border:1px solid var(--border);border-radius:3px;font-size:.7rem">Enter</kbd>
        or <kbd style="padding:1px 4px;background:var(--bg);border:1px solid var(--border);border-radius:3px;font-size:.7rem">,</kbd>
        to add a keyword. Tap a keyword to remove it.
      </p>
    </div>

    <!-- Shipping -->
    <div class="form-group" style="display:flex;align-items:center;gap:10px">
      <label class="toggle">
        <input type="checkbox" id="shipping">
        <span class="toggle-track"></span>
      </label>
      <span style="font-size:.9rem">Shipping available</span>
    </div>

    <!-- auth message -->
    <div id="formMessage"></div>

  </form>

  <!-- Sticky submit button -->
  <div class="detail-cta-bar">
    <button type="button" class="btn btn-primary btn-block" id="submitBtn" onclick="submitForm()">
      <i class="fas fa-tag"></i> <span id="submitLabel">Sell Now</span>
    </button>
  </div>

</div>

<script type="module">
  import { supabaseClient } from '/shared/supabase.js';
  import { checkAuth, handleError } from '/shared/utils.js';
  import { getUserCoordinates, reverseGeocode } from '../location/location.js';

  // ── Storage bucket name ──────────────────────────────────────
  // Change this one constant if you ever rename the bucket.
  const IMAGES_BUCKET = 'product_images';

  let detectedLocation = null;  
  let userLocationSource = 'unknown'; // 'gps' | 'manual'
  let currentUser = null;
  let selectedFiles = [];
  let editProductId = null;   // set when editing
  let existingImages = [];   // images already in DB
  let removedImages  = [];   // images user deletes
  let currentTags    = [];   // tag chips array (strings)
  
  // ── Tags chip input logic ───────────────────────────────────────────
  // Lets sellers add brand/model/specs as searchable keywords.
  // Each word added becomes a chip; clicking a chip removes it.
  function initTagsInput() {
    const tagsInput     = document.getElementById('tagsInput');
    const tagsContainer = document.getElementById('tagsContainer');
    if (!tagsInput || !tagsContainer) return;

    // Add a tag from whatever is typed
    function addTag(value) {
      const tag = value.trim().replace(/,+$/, '').trim();
      if (!tag || currentTags.includes(tag) || currentTags.length >= 20) return;
      currentTags.push(tag);
      renderTags();
      tagsInput.value = '';
    }

    // Re-render all chips
    function renderTags() {
      // Remove existing chips (not the input)
      tagsContainer.querySelectorAll('.tag-chip').forEach(el => el.remove());
      // Insert chips before the input
      currentTags.forEach(tag => {
        const chip = document.createElement('span');
        chip.className = 'tag-chip';
        chip.style.cssText = `
          display:inline-flex;align-items:center;gap:4px;
          background:var(--teal-light);color:var(--teal-dark);
          font-size:.75rem;font-weight:700;
          padding:3px 8px;border-radius:999px;cursor:pointer;
          user-select:none;
        `;
        chip.innerHTML = `${tag} <span style="font-size:.85rem;opacity:.7">×</span>`;
        chip.title = 'Click to remove';
        chip.onclick = () => {
          currentTags = currentTags.filter(t => t !== tag);
          renderTags();
        };
        tagsContainer.insertBefore(chip, tagsInput);
      });
    }

    tagsInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' || e.key === ',') {
        e.preventDefault();
        addTag(tagsInput.value);
      }
      // Backspace on empty input removes the last chip
      if (e.key === 'Backspace' && tagsInput.value === '' && currentTags.length > 0) {
        currentTags.pop();
        renderTags();
      }
    });

    // Also commit on blur so tapping elsewhere saves a half-typed tag
    tagsInput.addEventListener('blur', () => {
      if (tagsInput.value.trim()) addTag(tagsInput.value);
    });
  }

  // ── Boot ──
  document.addEventListener('DOMContentLoaded', async () => {
    initTagsInput();
    await autoDetectLocation();
    currentUser = await checkAuth();

    if (!currentUser) { window.location.href = '../auth/login.html'; return; }

    async function autoDetectLocation() {
      try {
        const coords = await getUserCoordinates();
        const location = await reverseGeocode(coords.lat, coords.lng);

        detectedLocation = location;
        userLocationSource = 'gps';

        // fill input automatically
        const locationInput = document.getElementById('location');
        if (locationInput && !locationInput.value) {
          locationInput.value = location.city;
        }

      } catch (err) {
        console.log('Auto location failed:', err.message);
      }
      const locationInput = document.getElementById('location');

        if (locationInput) {
          locationInput.addEventListener('input', () => {
            userLocationSource = 'manual';
          });
        }

    }

    // Check if editing an existing product
    const params = new URLSearchParams(window.location.search);
    editProductId = params.get('edit');
    if (editProductId) {
      document.getElementById('pageHeading').textContent = 'Edit Listing';
      document.getElementById('submitLabel').textContent = 'Save Changes';
      await prefillForm(editProductId);
    }

    initImageUpload();
  });

  // ── Prefill for edit mode ──
  async function prefillForm(id) {
    const { data, error } = await supabaseClient
      .from('products')
      .select('*')
      .eq('id', id)
      .single();

    if (error || data.seller_id !== currentUser.id) {
      alert('Product not found or access denied.');
      history.back();
      return;
    }

    // Fill fields
    document.getElementById('title').value       = data.title || '';
    document.getElementById('description').value = data.description || '';
    document.getElementById('price').value       = data.price || '';
    document.getElementById('condition').value   = data.condition || '';
    document.getElementById('category').value    = data.category || '';
    document.getElementById('location').value    = data.location || '';
    document.getElementById('shipping').checked  = !!data.shipping_available;

    // Pre-fill tags (brand, model, specs keywords)
    if (Array.isArray(data.tags) && data.tags.length > 0) {
      currentTags = [...data.tags];
      // Re-render chips — tagsInput and container exist by now
      const tagsContainer = document.getElementById('tagsContainer');
      const tagsInput     = document.getElementById('tagsInput');
      if (tagsContainer && tagsInput) {
        currentTags.forEach(tag => {
          const chip = document.createElement('span');
          chip.className = 'tag-chip';
          chip.style.cssText = `
            display:inline-flex;align-items:center;gap:4px;
            background:var(--teal-light);color:var(--teal-dark);
            font-size:.75rem;font-weight:700;
            padding:3px 8px;border-radius:999px;cursor:pointer;user-select:none;
          `;
          chip.innerHTML = `${tag} <span style="font-size:.85rem;opacity:.7">×</span>`;
          chip.onclick = () => {
            currentTags = currentTags.filter(t => t !== tag);
            chip.remove();
          };
          tagsContainer.insertBefore(chip, tagsInput);
        });
      }
    }

    // 🔥 Load images
    const { data: imgs } = await supabaseClient
      .from('product_images')
      .select('*')
      .eq('product_id', id)
      .order('image_order', { ascending: true });

    existingImages = imgs || [];

    renderPreviews(); // render BOTH existing + new
  }
  // ── Image upload zone ──
  function initImageUpload() {
    const input = document.getElementById('imageInput');
    const zone  = document.getElementById('uploadZone');

    input.addEventListener('change', (e) => {
      const newFiles = Array.from(e.target.files);
      selectedFiles = [...selectedFiles, ...newFiles].slice(0, 10);
      renderPreviews();
    });

    // Drag-and-drop
    zone.addEventListener('dragover', (e) => { e.preventDefault(); zone.classList.add('dragover'); });
    zone.addEventListener('dragleave', ()  => zone.classList.remove('dragover'));
    zone.addEventListener('drop', (e) => {
      e.preventDefault();
      zone.classList.remove('dragover');
      selectedFiles = [...selectedFiles, ...Array.from(e.dataTransfer.files)].slice(0, 10);
      renderPreviews();
    });
  }

  function renderPreviews() {
    const grid = document.getElementById('previewGrid');

    // Existing images
    const existingHtml = existingImages.map((img, i) => {
      const { data } = supabaseClient.storage
        .from(IMAGES_BUCKET)
        .getPublicUrl(img.image_url);

      return `
        <div class="preview-thumb-wrap">
          <img src="${data.publicUrl}">
          <button type="button" class="remove-thumb" onclick="removeExistingImg(${i})">×</button>
        </div>
      `;
    }).join('');

    // New images
    const newHtml = selectedFiles.map((f, i) => `
      <div class="preview-thumb-wrap">
        <img src="${URL.createObjectURL(f)}">
        <button type="button" class="remove-thumb" onclick="removeImg(${i})">×</button>
      </div>
    `).join('');

    grid.innerHTML = existingHtml + newHtml;

    const total = existingImages.length + selectedFiles.length;

    document.getElementById('uploadStatus').textContent =
      total > 0 ? `${total} photo${total>1?'s':''}` : '';
  }
  //Remove Existing image (mark for deletion)
    window.removeExistingImg = (idx) => {
    removedImages.push(existingImages[idx]);
    existingImages.splice(idx, 1);
    renderPreviews();
  };

  // ── Upload images to storage ──
  async function uploadImages(productId) {
    for (let i = 0; i < selectedFiles.length; i++) {
      const file     = selectedFiles[i];
      const filePath = `users/${currentUser.id}/${productId}/${Date.now()}_${file.name}`;

      document.getElementById('uploadStatus').textContent = `Uploading image ${i+1} of ${selectedFiles.length}…`;

      const { error: uploadError } = await supabaseClient.storage
        .from(IMAGES_BUCKET)
        .upload(filePath, file, { cacheControl: '3600', upsert: false });

      if (uploadError) throw new Error('Image upload failed: ' + uploadError.message);

      // Store only the storage path — NOT the full public URL.
      // The display URL is reconstructed at read time via getPublicUrl(filePath),
      // so renaming the bucket only requires changing IMAGES_BUCKET above.
      const { error: dbError } = await supabaseClient
        .from('product_images')
        .insert({ product_id: productId, image_url: filePath, image_order: i });

      if (dbError) throw new Error('Failed to save image: ' + dbError.message);
    }
    document.getElementById('uploadStatus').textContent = '';
  }

  // ── Submit / update ──
  window.submitForm = async () => {
    const title       = document.getElementById('title').value.trim();
    const description = document.getElementById('description').value.trim();
    const price       = parseFloat(document.getElementById('price').value);
    const condition   = document.getElementById('condition').value;
    const category    = document.getElementById('category').value;
    const location    = document.getElementById('location').value.trim();
    const shipping    = document.getElementById('shipping').checked;
    const msgDiv      = document.getElementById('formMessage');
    const btn         = document.getElementById('submitBtn');
    
    // 🧹 Delete removed images
    for (const img of removedImages) {
      await supabaseClient.storage
        .from(IMAGES_BUCKET)
        .remove([img.image_url]);

      await supabaseClient
        .from('product_images')
        .delete()
        .eq('id', img.id);
    }

    // Validation
    if (!title || !description || isNaN(price) || !condition || !category || !location) {
      showMsg(msgDiv, 'Please fill in all required fields.', 'error');
      return;
    }
    if (!editProductId && selectedFiles.length === 0) {
      showMsg(msgDiv, 'Please add at least one photo.', 'error');
      return;
    }

    btn.disabled = true;
    btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Saving…';

    try {
      const productData = { title, description, price, condition, category, location, shipping_available: shipping, tags: currentTags };

      let productId = editProductId;

      if (editProductId) {
        // Update existing
        const { error } = await supabaseClient
          .from('products')
          .update(productData)
          .eq('id', editProductId)
          .eq('seller_id', currentUser.id);
        if (error) throw error;
      } else {
        // Insert new
        const { data, error } = await supabaseClient
          .from('products')
          .insert({ ...productData, seller_id: currentUser.id })
          .select('id')
          .single();
        if (error) throw error;
        productId = data.id;
      }

      // Upload images
      if (selectedFiles.length > 0) {
        await uploadImages(productId);
      }

      showMsg(msgDiv, '✅ Listing saved!', 'success');
      btn.innerHTML = '✅ Saved!';

      setTimeout(() => {
        window.location.href = `./product.html?id=${productId}`;
      }, 1200);

    } catch (err) {
      console.error(err);
      showMsg(msgDiv, '❌ ' + handleError(err, 'Save listing'), 'error');
      btn.disabled = false;
      btn.innerHTML = `<i class="fas fa-tag"></i> ${editProductId ? 'Save Changes' : 'Sell Now'}`;
    }
 
    //Fix image order for existing images (moved to end of list)
    await supabaseClient
      .from('product_images')
      .update({ image_order: 0 })
      .eq('product_id', productId);
  };

  function showMsg(el, msg, type) {
    el.innerHTML = `<div class="alert alert-${type}" style="margin-bottom:8px">${msg}</div>`;
    if (type === 'success') setTimeout(() => { el.innerHTML = ''; }, 3000);
  }
</script>

<!-- Desktop sidebar -->
<script type="module" src="/shared/navigation.js"></script>

<!-- PWA Service Worker -->
<script>
  if ('serviceWorker' in navigator)
    window.addEventListener('load', () => navigator.serviceWorker.register('/pwa/sw.js',{scope:'/pwa/'}).catch(()=>{}));
</script>

</body>
</html>
